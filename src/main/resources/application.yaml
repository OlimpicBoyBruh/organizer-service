spring:
  application:
    name: Organizer App
  main:
    web-application-type: servlet
    banner-mode: off
  datasource:
    url: jdbc:h2:file:./data/organizer_db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

# H2 TCP server will be available at jdbc:h2:tcp://localhost:9091/./data/organizer_db
# H2 Web Console will be available at http://localhost:8083

logging:
  level:
    root: INFO
    ru.organaizersrv.uiorganizerapp: DEBUG

app:
  files:
    directory: ${user.home}/organizer_data/pdfs 